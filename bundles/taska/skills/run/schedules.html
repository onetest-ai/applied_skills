<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taska Schedules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* The project's schedules: what will run, set up, run with a preview, delete. Operations, not content: the workbench
   does not show it; a control panel frames it (/schedules?theme=dark), the onboarding skill uses the CLI. */
/*__TOKENS__*/
main#left{max-width:980px;margin:0 auto;padding:16px}
#schedules .card{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);padding:14px 16px;margin:0 0 10px;display:grid;gap:8px}
#schedules .card .head{display:flex;align-items:center;gap:8px;font-size:15px}
#schedules .card .what{color:var(--ink-2)}#schedules .card .when{font-size:13px;color:var(--ink-3)}
#schedules .who{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}#schedules .who>span:not(.chip){color:var(--ink-3);margin-right:2px}#schedules .who .chip{font-size:12px;padding:2px 8px}
#schedules .mode{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--ink-2)}#schedules .mode label{display:inline-flex;align-items:center;gap:6px}
#schedules .tag.kind{background:var(--accent-soft);color:var(--accent)}#schedules .tag.done{background:var(--done-soft);color:var(--done)}#schedules .tag.warn{background:var(--warn-soft);color:var(--warn)}#schedules .tag.off{background:var(--surface-2);color:var(--ink-3)}
#schedules .row{border:1px solid var(--line-strong);border-radius:var(--r-md);padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
#schedules .row label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:2px}
#schedules .row input[type=text],#schedules .row input[type=time],#schedules .row select{height:30px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);padding:0 8px;width:100%}
#schedules .days label,#schedules .inc label{display:inline-flex;align-items:center;gap:4px;margin:0 10px 0 0;font-size:13px;color:var(--ink-2)}
#schedules .wide{grid-column:1/-1}#schedules .foot{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
#schedules .owner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;margin:0 0 12px}#schedules .owner label{color:var(--ink-2)}#schedules .owner input{height:30px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:0 8px;min-width:260px;font-family:var(--mono);font-size:12px}
#schedules .err{color:var(--warn);margin:6px 0}
#schedules .card.risk{border-color:var(--risk)}#schedules .tag.risk{background:var(--risk-soft);color:var(--risk)}#schedules .warn-text{color:var(--warn)}
#sch-dialog{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);max-width:640px;width:calc(100% - 32px);padding:16px 18px}
#sch-dialog::backdrop{background:rgba(0,0,0,.35)}#sch-dialog h3{margin:0 0 10px;font-size:16px}
#sch-dialog .pv{width:100%;border-collapse:collapse;font-size:13px}#sch-dialog .pv th{text-align:left;color:var(--ink-3);font-weight:500;padding:5px 12px 5px 0;vertical-align:top;white-space:nowrap}#sch-dialog .pv td{padding:5px 0}
#schedules .rs{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:12px 16px;margin:0 0 12px}
#schedules .rs h2{font-size:15px;margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#schedules .chk{display:grid;grid-template-columns:20px 170px 1fr auto;gap:4px 10px;align-items:start;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
#schedules .chk:first-of-type{border-top:0}#schedules .chk .ic{font-weight:700;text-align:center}#schedules .chk .ok{color:var(--done)}#schedules .chk .missing{color:var(--risk)}#schedules .chk .check{color:var(--warn)}
#schedules .note{background:var(--surface-2);border-left:3px solid var(--line-strong);border-radius:var(--r-sm);padding:6px 10px;font-size:13px;color:var(--ink-2)}#schedules .note.warn{border-left-color:var(--warn)}
#schedules .last{background:var(--done-soft);border-radius:var(--r-sm);padding:8px 12px;margin:0 0 12px;font-size:13px}#schedules .last.bad{background:var(--risk-soft)}
#schedules .steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}#schedules .steps span{font-size:12px;border-radius:4px;padding:1px 7px;background:var(--surface)}
#schedules .setup input[type=text]{height:30px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);padding:0 8px;min-width:200px}
#schedules .setup pre{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-family:var(--mono);font-size:12px;overflow-x:auto;margin:6px 0}
#schedules .setup ol{margin:4px 0 8px 18px;padding:0;font-size:13px}#schedules .setup li{margin:5px 0}
@media (max-width:700px){#schedules .row{grid-template-columns:1fr}#schedules .chk{grid-template-columns:20px 1fr}#schedules .chk>*:nth-child(n+3){grid-column:2}}
</style>
</head>
<body>
<main id="left" aria-live="off"></main>
<div class="toast" id="toast" aria-live="polite"></div>
<script>
const LIVE = true;
/*__SHARED__*/
{ const q = new URLSearchParams(location.search).get("theme"), th = q || store.get("taska.theme");
  if (th === "dark" || th === "light") document.documentElement.dataset.theme = th; }
/* ---------- schedules: what will run, reconciled with the OS; set up, run with a preview, delete (live page only) ---------- */
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], INC = {body:"mail body", docx:"the docx", link:"link to the folder", pptx:"slides (pptx)", workbench:"workbench copy"};
const STATE = {active:["done","active"], not_registered:["warn","not registered"], not_loaded:["warn","not loaded"], off:["off","off"],
               stale:["risk","left behind"], foreign:["risk","outside taska.toml"], unreadable:["risk","unreadable job file"], outdated:["warn","old local time"]};
let SCH = null, schErr = "", schEdit = new Set(), schDirty = false, schSetup = false, runWatch = null;
async function loadSchedules(){ const r = await fetch("/api/schedules",{cache:"no-store"}); SCH = await r.json(); schEdit = new Set(); schDirty = false; }
function dayWords(days){
  const d = [...new Set(days||[])].sort();
  if (d.length === 7) return "day";
  if (d.join() === "1,2,3,4,5") return "Mon–Fri";
  return d.map(k => DAYS[k-1]).join(", ") || "no day";
}
function nextWords(iso){
  if (!iso) return "";
  return new Date(iso).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}) + " " + iso.slice(11,16);
}
function whenWords(when){
  const byTime = {};
  (when||[]).forEach(([d,t]) => (byTime[t] = byTime[t] || []).push(d));
  return Object.entries(byTime).map(([t,ds]) => `${dayWords(ds)} at ${t}`).join("; ") || "no time";
}
function chips(list){ return (list||[]).length ? list.map(a => `<span class="chip mono">${esc(a)}</span>`).join("") : `<span class="muted">nobody</span>`; }
function badge(state){ const [cls, words] = STATE[state] || ["off", state]; return `<span class="tag ${cls}">${esc(words)}</span>`; }
const osRow = name => (SCH.os||[]).find(r => r.schedule === name);
const unowned = () => (SCH.os||[]).filter(r => !r.schedule);
function clashes(row){
  const slots = new Set((row.when||[]).map(([d,t]) => d + " " + t));
  return SCH.schedules.filter(s => s.on !== false && (osRow(s.name)||{}).state === "active"
    && (s.fires_local||[]).some(x => slots.has((DAYS.indexOf(x.split(" ")[0]) + 1) + " " + x.split(" ")[1])));
}
function schCard(s, i){
  const st = osRow(s.name), state = st ? st.state : "not_registered";
  const exit = st && st.last_exit !== null && st.last_exit !== undefined ? ` · last exit ${st.last_exit}` : "";
  const byTime = {};
  (s.fires_local || []).forEach(x => { const [d, hm] = x.split(" "); (byTime[hm] = byTime[hm] || []).push(DAYS.indexOf(d) + 1); });
  const local = Object.entries(byTime).map(([hm, ds]) => `${dayWords(ds)} ${hm}`).join(", "), written = (s.when || "").split(" ").slice(0, 2).join(" ");
  const elsewhere = s.tz && local && !(s.fires_local || []).every(x => written.includes(x.split(" ")[1])) ? ` · fires ${esc(local)} on this Mac` : "";
  const why = {not_registered: "not registered yet: Save registers it", not_loaded: "not loaded: Save reloads it",
               outdated: "registered for an old local time (daylight saving moved it): Save re-registers it"}[state];
  return `<div class="card" data-i="${i}">
    <div class="head">${badge(state)}<b>${esc(s.name || "(unnamed)")}</b><span class="mono">${esc(s.when || "")}</span></div>
    <div class="what">${esc(s.what || "")}</div>
    ${s.never_mails ? `<div class="note">Never mails: update jobs don’t send${(s.unused_to||[]).length ? ` (its To, ${esc(s.unused_to.join(", "))}, is kept but unused)` : ""}.${s.command ? ` Runs its own command <span class="mono">${esc(s.command)}</span>.` : ""}</div>` : ""}
    ${s.absolute_command ? `<div class="note warn">This command names a full path, so it breaks on another computer: write it from <span class="mono">~</span> before a handover.</div>` : ""}
    <div class="when">${s.next ? `next <b class="mono">${esc(nextWords(s.next))}</b>` : (s.on === false ? "runs only when you press Run now" : "")}${elsewhere}${exit}${why ? ` · <span class="warn-text">${why}</span>` : ""}</div>
    <div class="foot"><button class="btn" data-run="${i}" ${s.name ? "" : "disabled"}>Run now…</button><span style="margin-left:auto;display:inline-flex;gap:6px"><button class="btn" data-edit="${i}">Edit</button><button class="btn" data-del="${i}">Delete…</button></span></div>
  </div>`;
}
function unownedCard(r, k){
  const two = clashes(r);
  return `<div class="card risk" data-u="${k}">
    <div class="head">${badge(r.state)}<b class="mono">${esc(r.label)}</b></div>
    <div class="what">${r.state === "stale" ? "A job this plugin registered for a schedule that no longer exists." : r.state === "unreadable" ? `A job file that names this project but cannot be read (not even by macOS's plutil), so what it runs is unknown. Open it: <span class="mono">${esc(r.path)}</span>` : "A job that runs this project but is not in taska.toml, so nothing else here knows about it."}</div>
    <div class="when">${esc(whenWords(r.when))} · ${r.loaded ? "loaded" : "not loaded"}${r.last_exit !== null && r.last_exit !== undefined ? ` · last exit ${r.last_exit}` : ""}</div>
    <div class="when">Runs <span class="mono">${esc(r.command||"")}</span></div>
    ${two.length ? `<div class="when warn-text">Runs at the same time as ${two.map(s => esc(s.name)).join(", ")}: two jobs.</div>` : ""}
    <div class="foot">${r.state === "foreign" ? `<button class="btn" data-copy="${k}">Copy into a schedule</button>` : ""}${r.state !== "unreadable" ? `<button class="btn" data-retire="${k}">Retire…</button>` : ""}</div>
  </div>`;
}
function schForm(s, i){
  const inc = Object.assign({body:true,docx:true,link:true,pptx:false,workbench:false}, s.include || {});
  const zones = [...new Set([SCH.local_zone, "Europe/Kyiv", "Europe/London", "America/New_York", "Asia/Kolkata", "UTC"].filter(Boolean))];
  return `<div class="row" data-i="${i}">
    <div><label for="f-name-${i}">Name</label><input id="f-name-${i}" type="text" data-f="name" value="${esc(s.name||"")}"></div>
    <div><label for="f-kind-${i}">What</label><select id="f-kind-${i}" data-f="kind"><option value="send" ${s.kind==="send"?"selected":""}>The weekly report</option><option value="preview" ${s.kind==="preview"?"selected":""}>A Friday draft (waits for the week's transcripts)</option><option value="update" ${s.kind==="update"?"selected":""}>Update the tree only (no mail)</option></select></div>
    <div class="wide days"><label>Days</label>${DAYS.map((d,k)=>`<label><input type="checkbox" data-d="${k+1}" ${(s.days||[]).includes(k+1)?"checked":""}>${d}</label>`).join("")}</div>
    <div><label for="f-time-${i}">Time</label><input id="f-time-${i}" type="time" data-f="time" value="${esc(s.time||"09:00")}"></div>
    <div><label for="f-tz-${i}">Time zone (IANA, e.g. Europe/Kyiv)</label><input id="f-tz-${i}" type="text" data-f="tz" list="sch-zones" autocomplete="off" value="${esc(s.tz || SCH.local_zone || "UTC")}"><datalist id="sch-zones">${zones.map(z => `<option value="${esc(z)}">`).join("")}</datalist></div>
    <div><label for="f-to-${i}">To (comma-separated; just you = a review copy)</label><input id="f-to-${i}" type="text" data-f="to" inputmode="email" autocomplete="off" value="${esc((s.to||[]).join(", "))}"></div>
    <div><label for="f-cc-${i}">Cc (comma-separated)</label><input id="f-cc-${i}" type="text" data-f="cc" inputmode="email" autocomplete="off" value="${esc((s.cc||[]).join(", "))}"></div>
    <div><label for="f-on-${i}">On</label><select id="f-on-${i}" data-f="on"><option value="1" ${s.on!==false?"selected":""}>On: runs at its time</option><option value="0" ${s.on===false?"selected":""}>Off: only when you press Run now</option></select></div>
    <div class="wide"><label for="f-cmd-${i}">Command (empty: ${esc(SCH.command || "taska run-schedule")})</label><input id="f-cmd-${i}" type="text" data-f="command" class="mono" value="${esc(s.command||"")}"></div>
    <div class="wide inc"><label>Include</label>${Object.keys(INC).map(k=>`<label><input type="checkbox" data-inc="${k}" ${inc[k]?"checked":""}>${INC[k]}</label>`).join("")}</div>
    <div class="foot"><span class="muted">Save registers the job with this computer's scheduler.</span><span style="margin-left:auto;display:inline-flex;gap:6px"><button class="btn" data-done="${i}">Done</button><button class="btn" data-del="${i}">Delete…</button></span></div>
  </div>`;
}
function schReadForm(r){
  const f = n => r.querySelector(`[data-f="${n}"]`).value;
  const list = v => v.split(",").map(x=>x.trim()).filter(Boolean);
  const include = {}; r.querySelectorAll("[data-inc]").forEach(c => include[c.dataset.inc] = c.checked);
  const i = +r.dataset.i, days = [...r.querySelectorAll("[data-d]")].filter(c=>c.checked).map(c=>+c.dataset.d);
  return Object.assign({}, SCH.schedules[i], { name: f("name").trim(), kind: f("kind"), days, time: f("time"), tz: f("tz").trim(),
           to: list(f("to")), cc: list(f("cc")), include, on: f("on")==="1", command: f("command").trim() });
}
const whenOf = s => `${(s.days||[]).map(d => DAYS[d-1]).join(",")} ${s.time} ${s.tz}`;
function schRead(){
  document.querySelectorAll("#schedules .row").forEach(r => { SCH.schedules[+r.dataset.i] = schReadForm(r); });
  return SCH.schedules.map(s => ({name:s.name, kind:s.kind, when:whenOf(s), to:s.to||[], cc:s.cc||[], include:s.include||{}, on:s.on!==false, command:s.command||""}));
}
function schProblems(rows, owner){
  const out = [], names = new Set();
  rows.forEach((s, i) => {
    const n = s.name || `schedule ${i+1}`;
    if (!s.name) out.push(`${n}: give it a name`);
    else if (names.has(s.name)) out.push(`${n}: two schedules have this name`);
    names.add(s.name);
    if (!((s.when||"").split(" ")[0])) out.push(`${n}: pick at least one day`);
    if (!/^\d\d:\d\d$/.test((s.when||"").split(" ")[1]||"")) out.push(`${n}: set a time`);
    if (!(s.when||"").split(" ")[2]) out.push(`${n}: name its time zone (e.g. Europe/Kyiv)`);
    if (s.kind === "send" && !(s.to||[]).length) out.push(`${n}: the weekly report needs a To address (yours, for a review copy)`);
    if (s.kind === "preview" && !(s.to||[]).length && !owner) out.push(`${n}: a preview needs a To address or the owner address above`);
  });
  return out;
}
async function schPost(path, body, btn, busyText){
  const was = btn ? btn.textContent : "";
  if (btn){ btn.disabled = true; btn.textContent = busyText; }
  try {
    const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j = await r.json().catch(()=>({error:"No answer from the server"}));
    return [r.ok, j];
  } catch (e) {
    return [false, {error: "The workbench did not answer: " + e.message}];
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = was; }
  }
}
function previewHtml(p){
  const m = p.mail;
  const row = (k, v) => `<tr><th>${k}</th><td>${v}</td></tr>`;
  return `<table class="pv">
    ${row("Week", esc(p.week))}
    ${row("Runs", `<span class="mono">${esc(p.command)}</span>`)}
    ${row("Steps", p.audience === "reader" ? "none: nothing is rebuilt" : p.steps_known ? esc(p.steps.join(" · ")) : `<span class="warn-text">Decided by that command; not described in taska.toml ([run].describe)</span>`)}
    ${p.decided_by && m ? row("Note", `<span class="warn-text">That command sends the mail itself; below is what taska's rules say it should do.</span>`) : ""}
    ${m ? row("Mail to", chips(m.to)) + row("Cc", chips(m.cc)) + (m.condition ? row("Sends", esc(m.condition)) : "") +
          row("Includes", esc(m.include.join(" · ") || "nothing")) + row("Not sent", esc(m.not_included.join(" · ") || "—")) +
          (m.held ? row("If held", `a HELD notice goes to ${chips(m.held.to)} only, never the reader`) : "") : row("Mail", "none: this job only updates the tree")}
  </table>`;
}
async function confirmRun(s){
  const r = await fetch(`/api/schedules/preview?name=${encodeURIComponent(s.name)}`, {cache:"no-store"});
  const p = await r.json().catch(() => ({error: "No answer from the server"}));
  if (!r.ok || p.error){ schErr = esc(p.error || "Could not describe this run"); renderSchedules(); return false; }
  const dlg = $("#sch-dialog");
  dlg.querySelector("h3").textContent = `Run "${s.name}" now?`;
  dlg.querySelector(".body").innerHTML = previewHtml(p);
  dlg.querySelector("[data-ok]").textContent = "Run now";
  dlg.returnValue = "";   // Esc closes without a value: an earlier OK must not count as this one
  dlg.showModal();
  return new Promise(res => { dlg.onclose = () => res(dlg.returnValue === "ok"); });
}
const ICON = {ok: "✓", missing: "✗", check: "?"};
const ACTION = {report_schedule: ["Set up a weekly report…", "setup"], owner: ["Set owner", "owner"], details: ["Fill in", "setup"]};
function reportPanel(){
  const rs = SCH.report_status; if (!rs) return "";
  const todo = rs.checks.filter(c => c.state !== "ok").length;
  return `<div class="rs" id="sch-report"><h2>Weekly report: ${rs.set_up ? "set up" : "not set up"} <span class="tag ${rs.set_up ? "done" : "risk"}">${rs.set_up ? "ready" : todo + " to do"}</span></h2>
    ${rs.set_up ? "" : `<div class="muted" style="font-size:13px;margin:4px 0 6px">Nothing is mailed for this project until every line is ticked.</div>`}
    ${rs.checks.map(c => `<div class="chk"><span class="ic ${c.state}">${ICON[c.state]}</span><b>${{report_schedule:"A report schedule", owner:"You as owner", details:"Report details", sender:"A step that sends mail"}[c.id]}</b><span class="muted">${esc(c.text)}</span>${c.state !== "ok" && ACTION[c.id] ? `<button class="btn ${c.id === "report_schedule" ? "primary" : ""}" data-act="${ACTION[c.id][1]}">${ACTION[c.id][0]}</button>` : "<span></span>"}</div>`).join("")}</div>`;
}
function lastRunBox(){
  const l = (SCH.report_status || {}).last_run; if (!l) return "";
  const ok = l.steps.every(x => x.ok), mail = (SCH.report_status.checks.find(c => c.id === "report_schedule") || {}).state === "ok";
  return `<div class="last ${ok ? "" : "bad"}"><b>Last run</b> <span class="muted">week of ${esc(l.week)} · ${esc((l.started||"").replace("T"," "))} → ${esc((l.finished||"still running").replace("T"," "))}</span>
    <div class="steps">${l.steps.map(x => `<span title="${esc(x.detail)}">${x.ok ? "✓" : "✗"} ${esc(x.id)}: ${esc(x.detail.slice(0, 50))}</span>`).join("")}</div>
    ${mail ? "" : `<div class="muted" style="margin-top:4px">Mail: none (no report schedule).</div>`}</div>`;
}
const uniqueName = base => { let n = base, k = 2; while (SCH.schedules.some(s => s.name === n)) n = `${base} ${k++}`; return n; };
function setupPanel(){
  const rs = SCH.report_status, rep = rs.report || {}, owner = rep.owner || SCH.owner || "", zone = SCH.local_zone || "UTC";
  const name = uniqueName("Weekly review");
  return `<div class="rs setup" id="sch-setup"><h2>Set up a weekly report <span class="tag warn">nothing is written until you press Save and register</span></h2>
    <div class="chk"><span class="ic">1</span><b>Your address</b><span><input type="text" id="su-owner" inputmode="email" value="${esc(owner)}" placeholder="needed before any report"><br><span class="muted">Review copies, held notices and cc of every send ([report].owner).</span></span><span></span></div>
    <div class="chk"><span class="ic">2</span><b>When</b><span><label><input type="radio" name="su-when" value="mon" checked> Monday 14:00, last week’s report</label><br><label><input type="radio" name="su-when" value="fri"> Friday 20:00, this week so far</label><br><span class="muted">Time zone ${esc(zone)}, read from this computer.</span></span><span></span></div>
    <div class="chk"><span class="ic">3</span><b>What’s in it</b><span>The week’s summary in the mail and the read-only workbench file. <span class="muted">A Word report needs a template first ([report].docx_glob).</span></span><span></span></div>
    <div class="chk"><span class="ic">4</span><b>Report details</b><span>Title <input type="text" id="su-title" value="${esc(rep.title || rs.project || "")}"> Client label <input type="text" id="su-client" value="${esc(rep.client_label || rs.project || "")}"> Greeting <input type="text" id="su-greet" value="${esc(rep.greet || firstName(owner))}" ${rep.greet ? 'data-typed="1"' : ""}></span><span></span></div>
    <div class="chk"><span class="ic">·</span><b>A reader</b><span class="muted">Not now. After you have received your review copies, add a schedule to the reader: it sends your review copy unchanged, or holds it if the tree changed since.</span><span></span></div>
    <h3 style="font-size:14px;margin:12px 0 4px">What Save and register will do</h3>
    <ol><li>Write to <span class="mono" title="${esc(rs.project_path)}">${esc(rs.toml)}</span> (the previous file is kept as taska.toml.bak; nothing else in it changes):<pre id="su-toml"></pre></li>
      <li>Register the job <span class="mono" id="su-label"></span> with this computer’s scheduler (${esc(rs.label_prefix)}&lt;schedule&gt;).${SCH.schedules.length ? ` ${SCH.schedules.map(s => `“${esc(s.name)}”`).join(", ")} stay as they are.` : ""}</li>
      ${(rs.checks.find(c => c.id === "sender") || {}).state === "ok" ? "" : `<li class="warn-text"><b>Still missing afterwards: a step that sends mail.</b> Until one exists, each run writes the mail to reports/&lt;week&gt;/mail.md and this page says it was written, not sent.</li>`}</ol>
    <details><summary class="muted">Prefer the terminal?</summary><pre>taska --project ${esc(rs.folder)} schedules --set schedules.json   # a JSON list of every schedule
taska --project ${esc(rs.folder)} schedules --preview "${esc(name)}"   # what the next run does and who gets it</pre><span class="muted">The report details are saved from this page.</span></details>
    <div class="bar"><button class="btn" id="su-cancel">Cancel</button><button class="btn primary" id="su-save" data-name="${esc(name)}">Save and register</button></div></div>`;
}
function setupValues(){
  const owner = $("#su-owner").value.trim(), fri = document.querySelector('input[name="su-when"]:checked').value === "fri", zone = SCH.local_zone || "UTC";
  const name = $("#su-save").dataset.name;
  const row = {name, kind: fri ? "preview" : "send", when: `${fri ? "Fri 20:00" : "Mon 14:00"} ${zone}`, to: [owner], cc: [],
               include: {body: true, docx: false, link: true, pptx: false, workbench: true}, on: true, command: ""};
  const report = {owner, title: $("#su-title").value.trim(), client_label: $("#su-client").value.trim(), greet: $("#su-greet").value.trim()};
  Object.keys(report).forEach(k => { if (!report[k]) delete report[k]; });
  return {row, report};
}
const firstName = addr => (addr.split("@")[0].split(/[._]/)[0] || "").replace(/^./, c => c.toUpperCase());
function setupPreview(e){
  const g = $("#su-greet");
  if (e && e.target === g) g.dataset.typed = "1";
  if (!g.dataset.typed) g.value = firstName($("#su-owner").value.trim());   // the greeting follows the address until you type one
  const {row, report} = setupValues(), q = v => JSON.stringify(v);
  $("#su-toml").textContent = `[report]\n${Object.entries(report).map(([k, v]) => `${k} = ${q(v)}`).join("\n")}\n\n[[schedules]]\nname = ${q(row.name)}\nkind = ${q(row.kind)}\nwhen = ${q(row.when)}\nto = [${row.to.map(q).join(", ")}]\ninclude = {body = true, docx = false, link = true, workbench = true}\non = true`;
  $("#su-label").textContent = SCH.report_status.label_prefix + row.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}
function watchRun(name, since){
  clearInterval(runWatch);
  const t0 = Date.now();
  runWatch = setInterval(async () => {
    if (Date.now() - t0 > 30 * 60 * 1000) return clearInterval(runWatch);
    await loadSchedules();
    const l = SCH.report_status && SCH.report_status.last_run;
    if (l && l.finished && new Date(l.finished) >= since){
      clearInterval(runWatch);
      const bad = l.steps.filter(x => !x.ok).map(x => x.id);
      toast(`${name} finished: ${bad.length ? "failed at " + bad.join(", ") : "every step ok"}${(SCH.report_status.checks.find(c => c.id === "sender") || {}).state === "ok" ? "" : "; mail written, not sent"}`);
      renderSchedules();
    }
  }, 5000);
}
async function renderSchedules(){
  if (!LIVE){ $("#left").innerHTML = `<div class="blank"><b>Schedules</b>Edited on the live workbench only.</div>`; return; }
  if (!SCH) await loadSchedules();
  const note = SCH.can_register ? `Each schedule names its time zone; this Mac is on ${esc(SCH.local_zone||SCH.timezone||"local time")}, and a time written in another zone is converted for its scheduler.` + (SCH.os_scope !== "launchd" ? " Jobs made outside taska are not listed on this system." : "")
                                : `This computer (${esc(SCH.platform)}) cannot register jobs yet: saving keeps the rows in taska.toml.`;
  const extra = unowned();
  $("#left").innerHTML = `<div id="schedules"><div class="muted" style="font-size:13px;margin:2px 0 8px">${note}</div>
    <div class="owner"><label for="sch-owner">You (previews, review copies, held notices, and cc of every report)</label><input id="sch-owner" type="email" data-f="owner" inputmode="email" autocomplete="off" placeholder="owner@example.com" value="${esc(SCH.owner||"")}"><span class="muted">saved with Save (<span class="mono">[report].owner</span>)</span></div>
    ${schErr?`<div class="err" role="alert">${schErr}</div>`:""}
    ${reportPanel()}${schSetup ? setupPanel() : ""}${lastRunBox()}
    ${extra.length ? `<div class="err" role="status">${extra.length} job${extra.length>1?"s":""} on this Mac run${extra.length>1?"":"s"} this project outside the list below.</div>${extra.map(unownedCard).join("")}` : ""}
    ${SCH.schedules.map((s,i) => schEdit.has(i) ? schForm(s,i) : schCard(s,i)).join("") || `<div class="blank"><b>No schedules yet</b>Add one, or copy a job listed above into a schedule.</div>`}
    <div class="bar"><button class="btn" id="sch-add">Add schedule</button><button class="btn primary" id="sch-save">Save</button>${schDirty?`<span class="muted">Unsaved changes</span>`:""}</div></div>
    <dialog id="sch-dialog" aria-labelledby="sch-dlg-title"><form method="dialog"><h3 id="sch-dlg-title"></h3><div class="body"></div>
      <div class="bar"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok" data-ok>Run now</button></div></form></dialog>`;
  const mark = () => { schDirty = true; };
  $("#sch-owner").oninput = mark;
  document.querySelectorAll("#schedules [data-act]").forEach(b => b.onclick = () => {
    if (b.dataset.act === "owner"){ $("#sch-owner").focus(); return; }
    schSetup = true; renderSchedules(); $("#sch-setup").scrollIntoView({block: "start"});
  });
  if (schSetup){
    setupPreview();
    document.querySelectorAll("#sch-setup input").forEach(x => x.oninput = x.onchange = setupPreview);
    $("#su-cancel").onclick = () => { schSetup = false; renderSchedules(); };
    $("#su-save").onclick = async () => {
      if (schDirty){ schErr = "Save the schedules below first: the set-up adds to what is saved."; return renderSchedules(); }
      const {row, report} = setupValues();
      const rows = schRead().concat([row]), problems = schProblems(rows, report.owner);
      if (!report.owner) problems.unshift("your address is needed");
      if (problems.length){ schErr = "Not saved: " + problems.map(esc).join("; "); return renderSchedules(); }
      const [ok, j] = await schPost("/api/schedules", {schedules: rows, report}, $("#su-save"), "Saving…");
      if (!ok){ schErr = esc(j.error || "Could not save"); return renderSchedules(); }
      schErr = ""; schSetup = false; await loadSchedules();
      toast(`Saved ${row.name} and registered ${(j.registered || []).filter(x => x.action === "loaded").length} job(s)`);
      renderSchedules();
    };
  }
  $("#sch-add").onclick = () => { schRead(); SCH.schedules.push({name:"", kind:"send", days:[1], time:"09:00", tz:SCH.local_zone||"UTC", to:[], cc:[], include:{}, on:true, command:""}); schEdit.add(SCH.schedules.length-1); schErr = ""; mark(); renderSchedules(); };
  document.querySelectorAll("#schedules [data-edit]").forEach(b => b.onclick = () => { schRead(); schEdit.add(+b.dataset.edit); renderSchedules(); });
  document.querySelectorAll("#schedules [data-done]").forEach(b => b.onclick = () => { schRead(); schEdit.delete(+b.dataset.done); mark(); renderSchedules(); });
  document.querySelectorAll("#schedules [data-copy]").forEach(b => b.onclick = () => {
    const r = extra[+b.dataset.copy], first = (r.when||[])[0] || [1, "06:00"];
    schRead();
    SCH.schedules.push({name: r.label.split(".").pop().replace(/[-_]/g, " "), kind:"update", days:[...new Set((r.when||[]).filter(w => w[1] === first[1]).map(w => w[0]))],
                        time:first[1], tz:SCH.local_zone||"UTC", to:[], cc:[], include:{}, on:true, command:r.command||""});
    schEdit.add(SCH.schedules.length-1); schErr = ""; mark(); renderSchedules();
  });
  document.querySelectorAll("#schedules [data-retire]").forEach(b => b.onclick = async () => {
    const r = extra[+b.dataset.retire];
    if (!confirm(`Retire ${r.label}? It is unloaded and its file moves to .taska/retired-jobs/ (kept, not deleted).`)) return;
    const [ok, j] = await schPost("/api/schedules/retire", {label: r.label}, b, "Retiring…");
    if (!ok){ schErr = esc(j.error || "Could not retire"); return renderSchedules(); }
    schErr = ""; await loadSchedules(); toast(`Retired ${r.label}; file kept at ${j.moved_to}`); renderSchedules();
  });
  document.querySelectorAll("#schedules [data-del]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.del, s = SCH.schedules[i];
    if (!s.label){ schRead(); SCH.schedules.splice(i, 1); schEdit = new Set(); renderSchedules(); return; }   // never saved: only on screen
    if (schDirty){ schErr = "Save first: Delete acts on what is saved in taska.toml."; return renderSchedules(); }
    if (!confirm(`Delete "${s.name}" and unload its job? Its job file moves to .taska/retired-jobs/ (kept).`)) return;
    const [ok, j] = await schPost("/api/schedules/delete", {name: s.name}, b, "Deleting…");
    if (!ok){ schErr = esc(j.error || "Could not delete"); return renderSchedules(); }
    schErr = ""; await loadSchedules(); toast(`Deleted ${s.name}`); renderSchedules();
  });
  const start = async (i, btn) => {
    const s = SCH.schedules[i];
    if (schDirty){ schErr = "Save first: the job runs what is saved in taska.toml, not what is on the screen."; return renderSchedules(); }
    if (!(await confirmRun(s))) return;
    const [ok, j] = await schPost("/api/schedules/run", {name: s.name}, btn, "Starting…");
    if (!ok){ schErr = esc(j.error || "Could not start"); return renderSchedules(); }
    toast(`Started: ${s.name} for the week of ${j.week}; its files land in ${j.dir}`);
    watchRun(s.name, new Date(Date.now() - 5000));
  };
  document.querySelectorAll("#schedules [data-run]").forEach(b => b.onclick = () => start(+b.dataset.run, b));
  $("#sch-save").onclick = async () => {
    const rows = schRead(), owner = $("#sch-owner").value.trim();
    const problems = schProblems(rows, owner || SCH.owner);
    if (problems.length){ schErr = "Not saved: " + problems.map(esc).join("; "); return renderSchedules(); }
    const [ok, j] = await schPost("/api/schedules", Object.assign({schedules: rows}, owner && owner !== (SCH.owner||"") ? {owner} : {}), $("#sch-save"), "Saving…");
    if (!ok){ schErr = esc(j.error || "Could not save"); return renderSchedules(); }
    schErr = ""; await loadSchedules();
    toast(SCH.can_register ? `Saved and registered ${j.registered.filter(x=>x.action==="loaded").length} job(s)` : "Saved to taska.toml");
    renderSchedules();
  };
}
window.addEventListener("beforeunload", e => { if (schDirty){ e.preventDefault(); e.returnValue = ""; } });
renderSchedules().catch(err => { $("#left").innerHTML = `<div class="blank" role="alert"><b>Could not load the schedules</b>${esc(err.message)}</div>`; });
</script>
</body>
</html>
