<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taska Schedules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* The project's schedules: what will run, set up, run with a preview, delete. Operations, not content: the workbench
   does not show it; a control panel frames it (/schedules?theme=dark), the onboarding skill uses the CLI. */
/*__TOKENS__*/
main#left{max-width:980px;margin:0 auto;padding:16px}
#schedules .card{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);padding:14px 16px;margin:0 0 10px;display:grid;gap:8px}
#schedules .card .head{display:flex;align-items:center;gap:8px;font-size:15px}
#schedules .card .what{color:var(--ink-2)}#schedules .card .when{font-size:13px;color:var(--ink-3)}
#schedules .who{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}#schedules .who>span:not(.chip){color:var(--ink-3);margin-right:2px}#schedules .who .chip{font-size:12px;padding:2px 8px}
#schedules .mode{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--ink-2)}#schedules .mode label{display:inline-flex;align-items:center;gap:6px}
#schedules .tag.kind{background:var(--accent-soft);color:var(--accent)}#schedules .tag.done{background:var(--done-soft);color:var(--done)}#schedules .tag.warn{background:var(--warn-soft);color:var(--warn)}#schedules .tag.off{background:var(--surface-2);color:var(--ink-3)}
#schedules .row{border:1px solid var(--line-strong);border-radius:var(--r-md);padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
#schedules .row label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:2px}
#schedules .row input[type=text],#schedules .row input[type=time],#schedules .row select{height:30px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);padding:0 8px;width:100%}
#schedules .days label,#schedules .inc label{display:inline-flex;align-items:center;gap:4px;margin:0 10px 0 0;font-size:13px;color:var(--ink-2)}
#schedules .wide{grid-column:1/-1}#schedules .foot{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
#schedules .owner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;margin:0 0 12px}#schedules .owner label{color:var(--ink-2)}#schedules .owner input{height:30px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:0 8px;min-width:260px;font-family:var(--mono);font-size:12px}
#schedules .err{color:var(--warn);margin:6px 0}
#schedules .card.risk{border-color:var(--risk)}#schedules .tag.risk{background:var(--risk-soft);color:var(--risk)}#schedules .warn-text{color:var(--warn)}
#sch-dialog{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);max-width:640px;width:calc(100% - 32px);padding:16px 18px}
#sch-dialog::backdrop{background:rgba(0,0,0,.35)}#sch-dialog h3{margin:0 0 10px;font-size:16px}
#sch-dialog .pv{width:100%;border-collapse:collapse;font-size:13px}#sch-dialog .pv th{text-align:left;color:var(--ink-3);font-weight:500;padding:5px 12px 5px 0;vertical-align:top;white-space:nowrap}#sch-dialog .pv td{padding:5px 0}
@media (max-width:700px){#schedules .row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="left" aria-live="off"></main>
<div class="toast" id="toast" aria-live="polite"></div>
<script>
const LIVE = true;
/*__SHARED__*/
{ const q = new URLSearchParams(location.search).get("theme"), th = q || store.get("taska.theme");
  if (th === "dark" || th === "light") document.documentElement.dataset.theme = th; }
/* ---------- schedules: what will run, reconciled with the OS; set up, run with a preview, delete (live page only) ---------- */
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], INC = {body:"mail body", docx:"the docx", link:"link to the folder", pptx:"slides (pptx)", workbench:"workbench copy"};
const KIND_LABEL = {preview:"Preview", send:"Send", update:"Update"};
const STATE = {active:["done","active"], not_registered:["warn","not registered"], not_loaded:["warn","not loaded"], off:["off","off"],
               stale:["risk","left behind"], foreign:["risk","outside taska.toml"], unreadable:["risk","unreadable job file"]};
let SCH = null, schErr = "", schEdit = new Set(), schDirty = false;
async function loadSchedules(){ const r = await fetch("/api/schedules",{cache:"no-store"}); SCH = await r.json(); schEdit = new Set(); schDirty = false; }
function dayWords(days){
  const d = [...new Set(days||[])].sort();
  if (d.length === 7) return "day";
  if (d.join() === "1,2,3,4,5") return "Mon–Fri";
  return d.map(k => DAYS[k-1]).join(", ") || "no day";
}
function nextWords(iso){
  if (!iso) return "";
  return new Date(iso).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}) + " " + iso.slice(11,16);
}
function whenWords(when){
  const byTime = {};
  (when||[]).forEach(([d,t]) => (byTime[t] = byTime[t] || []).push(d));
  return Object.entries(byTime).map(([t,ds]) => `${dayWords(ds)} at ${t}`).join("; ") || "no time";
}
function chips(list){ return (list||[]).length ? list.map(a => `<span class="chip mono">${esc(a)}</span>`).join("") : `<span class="muted">nobody</span>`; }
function badge(state){ const [cls, words] = STATE[state] || ["off", state]; return `<span class="tag ${cls}">${esc(words)}</span>`; }
const osRow = name => (SCH.os||[]).find(r => r.schedule === name);
const unowned = () => (SCH.os||[]).filter(r => !r.schedule);
function clashes(row){
  const slots = new Set((row.when||[]).map(([d,t]) => d + " " + t));
  return SCH.schedules.filter(s => s.on !== false && (osRow(s.name)||{}).state === "active" && (s.days||[]).some(d => slots.has(d + " " + s.time)));
}
function schCard(s, i){
  const st = osRow(s.name), state = st ? st.state : "not_registered";
  const exit = st && st.last_exit !== null && st.last_exit !== undefined ? ` · last exit ${st.last_exit}` : "";
  const when = s.on === false ? "Paused" : `Every ${esc(dayWords(s.days))} at <b class="mono">${esc(s.time)}</b> (${esc(SCH.timezone||"this machine's time")})` + (s.next ? ` · next <b class="mono">${esc(nextWords(s.next))}</b>` : "") + exit;
  const to = (s.to||[]).length ? s.to : (s.kind === "preview" && SCH.owner ? [SCH.owner] : []);
  const who = s.kind === "update" ? "" : `<div class="who"><span>To</span>${chips(to)}${s.kind === "send" ? `<span>Cc</span>${chips(s.cc)}` : ""}</div>`;
  const mode = s.kind === "send" ? `<div class="mode">
      <label><input type="radio" name="mode-${i}" data-review="${i}" value="1" ${s.review?"checked":""}> Review first: the run mails me, I press Send</label>
      <label><input type="radio" name="mode-${i}" data-review="${i}" value="0" ${s.review?"":"checked"}> Send to the reader automatically</label></div>` : "";
  const why = {not_registered:"Not registered with this Mac's scheduler: Save registers it.", not_loaded:"The job file exists but launchd has not loaded it: Save reloads it."}[state];
  return `<div class="card" data-i="${i}">
    <div class="head">${badge(state)}<b>${esc(s.name||"(unnamed)")}</b><span class="tag kind">${KIND_LABEL[s.kind]||esc(s.kind)}</span></div>
    <div class="what">${esc(s.what||"")}</div>
    <div class="when">${when}</div>
    ${why ? `<div class="when warn-text">${why}</div>` : ""}
    ${who}${mode}
    <div class="when">Runs <span class="mono">${esc(s.runs || s.command || SCH.command || "taska run-schedule")}</span></div>
    <div class="foot"><button class="btn" data-run="${i}" ${s.name?"":"disabled"}>Run now…</button>${s.kind === "send" && s.review ? `<button class="btn primary" data-send="${i}">Send now…</button>` : ""}<a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="file://${esc(SCH.reports_dir||"")}/" title="The report folder">Open the files</a><span style="margin-left:auto;display:inline-flex;gap:6px"><button class="btn" data-edit="${i}">Edit</button><button class="btn" data-del="${i}">Delete…</button></span></div>
  </div>`;
}
function unownedCard(r, k){
  const two = clashes(r);
  return `<div class="card risk" data-u="${k}">
    <div class="head">${badge(r.state)}<b class="mono">${esc(r.label)}</b></div>
    <div class="what">${r.state === "stale" ? "A job this plugin registered for a schedule that no longer exists." : r.state === "unreadable" ? `A job file that names this project but cannot be read (not even by macOS's plutil), so what it runs is unknown. Open it: <span class="mono">${esc(r.path)}</span>` : "A job that runs this project but is not in taska.toml, so nothing else here knows about it."}</div>
    <div class="when">${esc(whenWords(r.when))} · ${r.loaded ? "loaded" : "not loaded"}${r.last_exit !== null && r.last_exit !== undefined ? ` · last exit ${r.last_exit}` : ""}</div>
    <div class="when">Runs <span class="mono">${esc(r.command||"")}</span></div>
    ${two.length ? `<div class="when warn-text">Runs at the same time as ${two.map(s => esc(s.name)).join(", ")}: two jobs.</div>` : ""}
    <div class="foot">${r.state === "foreign" ? `<button class="btn" data-copy="${k}">Copy into a schedule</button>` : ""}${r.state !== "unreadable" ? `<button class="btn" data-retire="${k}">Retire…</button>` : ""}</div>
  </div>`;
}
function schForm(s, i){
  const inc = Object.assign({body:true,docx:true,link:true,pptx:false,workbench:false}, s.include || {});
  return `<div class="row" data-i="${i}">
    <div><label for="f-name-${i}">Name</label><input id="f-name-${i}" type="text" data-f="name" value="${esc(s.name||"")}"></div>
    <div><label for="f-kind-${i}">What</label><select id="f-kind-${i}" data-f="kind"><option value="preview" ${s.kind==="preview"?"selected":""}>Preview to me</option><option value="send" ${s.kind==="send"?"selected":""}>Send to the reader</option><option value="update" ${s.kind==="update"?"selected":""}>Update the tree only</option></select></div>
    <div class="wide days"><label>Days</label>${DAYS.map((d,k)=>`<label><input type="checkbox" data-d="${k+1}" ${(s.days||[]).includes(k+1)?"checked":""}>${d}</label>`).join("")}</div>
    <div><label for="f-time-${i}">Time (${esc(SCH.timezone||"this machine's time")})</label><input id="f-time-${i}" type="time" data-f="time" value="${esc(s.time||"09:00")}"></div>
    <div><label for="f-on-${i}">On</label><select id="f-on-${i}" data-f="on"><option value="1" ${s.on!==false?"selected":""}>On</option><option value="0" ${s.on===false?"selected":""}>Off</option></select></div>
    <div><label for="f-to-${i}">To (comma-separated)</label><input id="f-to-${i}" type="text" data-f="to" inputmode="email" autocomplete="off" value="${esc((s.to||[]).join(", "))}"></div>
    <div><label for="f-cc-${i}">Cc (comma-separated)</label><input id="f-cc-${i}" type="text" data-f="cc" inputmode="email" autocomplete="off" value="${esc((s.cc||[]).join(", "))}"></div>
    <div class="wide"><label for="f-cmd-${i}">Command (empty: ${esc(SCH.command || "taska run-schedule")})</label><input id="f-cmd-${i}" type="text" data-f="command" class="mono" value="${esc(s.command||"")}"></div>
    <div class="wide inc"><label>Include</label>${Object.keys(INC).map(k=>`<label><input type="checkbox" data-inc="${k}" ${inc[k]?"checked":""}>${INC[k]}</label>`).join("")}</div>
    <div class="foot"><span class="muted">Save registers the job with this computer's scheduler.</span><span style="margin-left:auto;display:inline-flex;gap:6px"><button class="btn" data-done="${i}">Done</button><button class="btn" data-del="${i}">Delete…</button></span></div>
  </div>`;
}
function schReadForm(r){
  const f = n => r.querySelector(`[data-f="${n}"]`).value;
  const list = v => v.split(",").map(x=>x.trim()).filter(Boolean);
  const include = {}; r.querySelectorAll("[data-inc]").forEach(c => include[c.dataset.inc] = c.checked);
  const kind = f("kind"), i = +r.dataset.i, review = kind === "send" && !!(SCH.schedules[i] && SCH.schedules[i].review);
  return Object.assign({}, SCH.schedules[i], { name: f("name").trim(), kind, days: [...r.querySelectorAll("[data-d]")].filter(c=>c.checked).map(c=>+c.dataset.d),
           time: f("time"), to: list(f("to")), cc: list(f("cc")), include, on: f("on")==="1", review, command: f("command").trim() });
}
function schRead(){
  document.querySelectorAll("#schedules .row").forEach(r => { SCH.schedules[+r.dataset.i] = schReadForm(r); });
  return SCH.schedules.map(s => ({name:s.name, kind:s.kind, days:s.days, time:s.time, to:s.to||[], cc:s.cc||[], include:s.include||{}, on:s.on!==false, review:!!s.review, command:s.command||""}));
}
function schProblems(rows, owner){
  const out = [], names = new Set();
  rows.forEach((s, i) => {
    const n = s.name || `schedule ${i+1}`;
    if (!s.name) out.push(`${n}: give it a name`);
    else if (names.has(s.name)) out.push(`${n}: two schedules have this name`);
    names.add(s.name);
    if (!(s.days||[]).length) out.push(`${n}: pick at least one day`);
    if (!/^\d\d:\d\d$/.test(s.time||"")) out.push(`${n}: set a time`);
    if (s.kind === "send" && !(s.to||[]).length) out.push(`${n}: a send needs a To address`);
    if (s.kind === "preview" && !(s.to||[]).length && !owner) out.push(`${n}: a preview needs a To address or the owner address above`);
  });
  return out;
}
async function schPost(path, body, btn, busyText){
  const was = btn ? btn.textContent : "";
  if (btn){ btn.disabled = true; btn.textContent = busyText; }
  try {
    const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j = await r.json().catch(()=>({error:"No answer from the server"}));
    return [r.ok, j];
  } catch (e) {
    return [false, {error: "The workbench did not answer: " + e.message}];
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = was; }
  }
}
function previewHtml(p, send){
  const m = p.mail;
  const row = (k, v) => `<tr><th>${k}</th><td>${v}</td></tr>`;
  return `<table class="pv">
    ${row("Week", esc(p.week))}
    ${row("Runs", `<span class="mono">${esc(p.command)}</span>`)}
    ${row("Steps", p.steps_known ? esc(p.steps.join(" · ")) : `<span class="warn-text">Decided by that command; not described in taska.toml ([run].describe)</span>`)}
    ${p.decided_by && m ? row("Note", `<span class="warn-text">That command sends the mail itself; below is what taska's rules say it should do.</span>`) : ""}
    ${m ? row("Mail to", m.review_copy ? `${chips(m.to)} <span class="muted">review copy: the reader gets it only on Send now</span>` : chips(m.to)) + row("Cc", chips(m.cc)) +
          row("Includes", esc(m.include.join(" · ") || "nothing")) + row("Not sent", esc(m.not_included.join(" · ") || "—")) +
          (m.held ? row("If held", `a failed step or gate sends a HELD notice to ${chips(m.held.to)} only, never the reader`) : "") : row("Mail", "none: this job only updates the tree")}
  </table>`;
}
async function confirmRun(s, send){
  const r = await fetch(`/api/schedules/preview?name=${encodeURIComponent(s.name)}&send=${send?1:0}`, {cache:"no-store"});
  const p = await r.json().catch(() => ({error: "No answer from the server"}));
  if (!r.ok || p.error){ schErr = esc(p.error || "Could not describe this run"); renderSchedules(); return false; }
  const dlg = $("#sch-dialog");
  dlg.querySelector("h3").textContent = `${send ? "Send" : "Run"} "${s.name}" now?`;
  dlg.querySelector(".body").innerHTML = previewHtml(p, send);
  dlg.querySelector("[data-ok]").textContent = send ? "Send now" : "Run now";
  dlg.returnValue = "";   // Esc closes without a value: an earlier OK must not count as this one
  dlg.showModal();
  return new Promise(res => { dlg.onclose = () => res(dlg.returnValue === "ok"); });
}
async function renderSchedules(){
  if (!LIVE){ $("#left").innerHTML = `<div class="blank"><b>Schedules</b>Edited on the live workbench only.</div>`; return; }
  if (!SCH) await loadSchedules();
  const note = SCH.can_register ? `Times are this computer's (${esc(SCH.timezone||"local")}): that is when its scheduler fires.` + (SCH.os_scope !== "launchd" ? " Jobs made outside taska are not listed on this system." : "")
                                : `This computer (${esc(SCH.platform)}) cannot register jobs yet: saving keeps the rows in taska.toml.`;
  const extra = unowned();
  $("#left").innerHTML = `<div id="schedules"><div class="muted" style="font-size:13px;margin:2px 0 8px">${note}</div>
    <div class="owner"><label for="sch-owner">Previews, review copies and held mails go to</label><input id="sch-owner" type="email" data-f="owner" inputmode="email" autocomplete="off" placeholder="owner@example.com" value="${esc(SCH.owner||"")}"><span class="muted">saved with Save (<span class="mono">[report].owner</span>)</span></div>
    ${schErr?`<div class="err" role="alert">${schErr}</div>`:""}
    ${extra.length ? `<div class="err" role="status">${extra.length} job${extra.length>1?"s":""} on this Mac run${extra.length>1?"":"s"} this project outside the list below.</div>${extra.map(unownedCard).join("")}` : ""}
    ${SCH.schedules.map((s,i) => schEdit.has(i) ? schForm(s,i) : schCard(s,i)).join("") || `<div class="blank"><b>No schedules yet</b>Add one, or copy a job listed above into a schedule.</div>`}
    <div class="bar"><button class="btn" id="sch-add">Add schedule</button><button class="btn primary" id="sch-save">Save</button>${schDirty?`<span class="muted">Unsaved changes</span>`:""}</div></div>
    <dialog id="sch-dialog" aria-labelledby="sch-dlg-title"><form method="dialog"><h3 id="sch-dlg-title"></h3><div class="body"></div>
      <div class="bar"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok" data-ok>Run now</button></div></form></dialog>`;
  const mark = () => { schDirty = true; };
  $("#sch-owner").oninput = mark;
  $("#sch-add").onclick = () => { schRead(); SCH.schedules.push({name:"", kind:"preview", days:[5], time:"17:00", to:[], cc:[], include:{}, on:true, review:false, command:""}); schEdit.add(SCH.schedules.length-1); schErr = ""; mark(); renderSchedules(); };
  document.querySelectorAll("#schedules [data-edit]").forEach(b => b.onclick = () => { schRead(); schEdit.add(+b.dataset.edit); renderSchedules(); });
  document.querySelectorAll("#schedules [data-done]").forEach(b => b.onclick = () => { schRead(); schEdit.delete(+b.dataset.done); mark(); renderSchedules(); });
  document.querySelectorAll("#schedules [data-review]").forEach(r => r.onchange = () => { SCH.schedules[+r.dataset.review].review = r.value === "1"; mark(); renderSchedules(); });
  document.querySelectorAll("#schedules [data-copy]").forEach(b => b.onclick = () => {
    const r = extra[+b.dataset.copy], first = (r.when||[])[0] || [1, "06:00"];
    schRead();
    SCH.schedules.push({name: r.label.split(".").pop().replace(/[-_]/g, " "), kind:"update", days:[...new Set((r.when||[]).filter(w => w[1] === first[1]).map(w => w[0]))],
                        time:first[1], to:[], cc:[], include:{}, on:true, review:false, command:r.command||""});
    schEdit.add(SCH.schedules.length-1); schErr = ""; mark(); renderSchedules();
  });
  document.querySelectorAll("#schedules [data-retire]").forEach(b => b.onclick = async () => {
    const r = extra[+b.dataset.retire];
    if (!confirm(`Retire ${r.label}? It is unloaded and its file moves to .taska/retired-jobs/ (kept, not deleted).`)) return;
    const [ok, j] = await schPost("/api/schedules/retire", {label: r.label}, b, "Retiring…");
    if (!ok){ schErr = esc(j.error || "Could not retire"); return renderSchedules(); }
    schErr = ""; await loadSchedules(); toast(`Retired ${r.label}; file kept at ${j.moved_to}`); renderSchedules();
  });
  document.querySelectorAll("#schedules [data-del]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.del, s = SCH.schedules[i];
    if (!s.label){ schRead(); SCH.schedules.splice(i, 1); schEdit = new Set(); renderSchedules(); return; }   // never saved: only on screen
    if (schDirty){ schErr = "Save first: Delete acts on what is saved in taska.toml."; return renderSchedules(); }
    if (!confirm(`Delete "${s.name}" and unload its job? Its job file moves to .taska/retired-jobs/ (kept).`)) return;
    const [ok, j] = await schPost("/api/schedules/delete", {name: s.name}, b, "Deleting…");
    if (!ok){ schErr = esc(j.error || "Could not delete"); return renderSchedules(); }
    schErr = ""; await loadSchedules(); toast(`Deleted ${s.name}`); renderSchedules();
  });
  const start = async (i, send, btn) => {
    const s = SCH.schedules[i];
    if (schDirty){ schErr = "Save first: the job runs what is saved in taska.toml, not what is on the screen."; return renderSchedules(); }
    if (!(await confirmRun(s, send))) return;
    const [ok, j] = await schPost("/api/schedules/run", {name: s.name, send}, btn, send ? "Sending…" : "Starting…");
    if (!ok){ schErr = esc(j.error || "Could not start"); return renderSchedules(); }
    toast(`${send ? "Sending" : "Started"}: ${s.name} for the week of ${j.week}; its files land in ${j.dir}`);
  };
  document.querySelectorAll("#schedules [data-run]").forEach(b => b.onclick = () => start(+b.dataset.run, false, b));
  document.querySelectorAll("#schedules [data-send]").forEach(b => b.onclick = () => start(+b.dataset.send, true, b));
  $("#sch-save").onclick = async () => {
    const rows = schRead(), owner = $("#sch-owner").value.trim();
    const problems = schProblems(rows, owner || SCH.owner);
    if (problems.length){ schErr = "Not saved: " + problems.map(esc).join("; "); return renderSchedules(); }
    const [ok, j] = await schPost("/api/schedules", Object.assign({schedules: rows}, owner && owner !== (SCH.owner||"") ? {owner} : {}), $("#sch-save"), "Saving…");
    if (!ok){ schErr = esc(j.error || "Could not save"); return renderSchedules(); }
    schErr = ""; await loadSchedules();
    toast(SCH.can_register ? `Saved and registered ${j.registered.filter(x=>x.action==="loaded").length} job(s)` : "Saved to taska.toml");
    renderSchedules();
  };
}
window.addEventListener("beforeunload", e => { if (schDirty){ e.preventDefault(); e.returnValue = ""; } });
renderSchedules().catch(err => { $("#left").innerHTML = `<div class="blank" role="alert"><b>Could not load the schedules</b>${esc(err.message)}</div>`; });
</script>
</body>
</html>
