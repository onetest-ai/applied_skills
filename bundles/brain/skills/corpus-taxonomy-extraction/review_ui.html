<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taxonomy review</title>
<style>
:root{
  --ground:#F2F4F0; --paper:#FFFFFF; --sunk:#EEF1EB; --ink:#18201C; --ink-2:#4A554F; --ink-3:#7A857F;
  --line:#DCE2DC; --line-2:#C7D0C8; --accent:#4F6420; --accent-soft:#E7EDD6; --on-accent:#FFFFFF;
  --ok:#2F7A4B; --ok-soft:#DDF0E3; --warn:#9A6400; --warn-soft:#FBEFD6; --bad:#B03A2E; --bad-soft:#F8E0DC;
  --info:#2F5E8C; --info-soft:#E0EAF4;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111513; --paper:#191F1C; --sunk:#151A17; --ink:#E6EBE7; --ink-2:#B3BDB7; --ink-3:#86918B;
    --line:#29312D; --line-2:#38423D; --accent:#A9C46A; --accent-soft:#283218; --on-accent:#131A0B;
    --ok:#6FCB8E; --ok-soft:#17301E; --warn:#E5B35A; --warn-soft:#332811; --bad:#EE8A7E; --bad-soft:#381C18;
    --info:#8DB7E2; --info-soft:#172839; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#111513; --paper:#191F1C; --sunk:#151A17; --ink:#E6EBE7; --ink-2:#B3BDB7; --ink-3:#86918B;
  --line:#29312D; --line-2:#38423D; --accent:#A9C46A; --accent-soft:#283218; --on-accent:#131A0B;
  --ok:#6FCB8E; --ok-soft:#17301E; --warn:#E5B35A; --warn-soft:#332811; --bad:#EE8A7E; --bad-soft:#381C18;
  --info:#8DB7E2; --info-soft:#172839; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);display:flex;flex-direction:column;height:100vh;overflow:hidden}
h3{font:700 21px/1.25 var(--display);margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
p{margin:0;max-width:72ch}
code{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kbd{font:600 11px/1 var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--ink-2);background:var(--paper)}
.note{font-size:14px;color:var(--ink-3)}
.err{color:var(--bad);font-size:14px}
.err:empty{display:none}
[hidden]{display:none!important}

/* header */
.bar{flex:none;display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.bar .ttl{display:flex;flex-direction:column;gap:1px;min-width:0}
.bar .ttl b{font:600 16px var(--display);overflow-wrap:anywhere}
.bar .ttl span{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.sp{flex:1}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog .track{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* buttons */
.btn{font:600 14px/1 var(--sans);padding:9px 13px;border-radius:7px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary .count{background:rgba(255,255,255,.22);border-radius:999px;padding:2px 7px;font-size:12px;font-variant-numeric:tabular-nums}
.btn.ok{color:var(--ok);border-color:var(--ok)} .btn.bad{color:var(--bad);border-color:var(--bad)}
.linkbtn{all:unset;cursor:pointer;color:var(--info);font-size:12px;text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* frame */
.app{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--paper)}
.app.solo{grid-template-columns:minmax(0,1fr)}
.nav{border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px;background:var(--sunk);overflow:auto}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav button[aria-current="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nav .cnt{margin-left:auto;font:600 11px var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav .cnt.hot{color:var(--on-accent);background:var(--accent);border-radius:999px;padding:1px 7px}
.nav hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
.nav .hint{font-size:12px;color:var(--ink-3);padding:4px 10px;line-height:1.9}
.viewhost{min-height:0;min-width:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr)}
.view.single{display:block;overflow:auto}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.ltools{flex:none;border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.lrow{display:flex;gap:8px;align-items:center;padding:10px 14px 0}
.lrow input{flex:1;min-width:0}
.rows{flex:1;min-height:0;overflow:auto;padding-bottom:12px}
.lgroup{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:14px 14px 6px}
.detail{padding:20px 22px 40px;display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0;overflow:auto}
.detail .where{font:12px var(--mono);color:var(--ink-3);overflow-wrap:anywhere}
.section{display:flex;flex-direction:column;gap:8px}
.section>b{font-size:14px}

/* inbox items */
.item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:2px 10px;padding:10px 14px;border-left:3px solid transparent;width:100%}
.item:hover{background:var(--sunk)} .item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.item.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.item .t{font-size:14.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item .s{grid-column:2;font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.item .st{grid-row:1/3;grid-column:3;align-self:center}
.ic{align-self:start;font:700 13px/1.4 var(--mono);text-align:center;border-radius:4px;display:inline-block;min-width:18px;padding:0 3px}
.ic.add{color:var(--ok);background:var(--ok-soft)} .ic.chg{color:var(--info);background:var(--info-soft)} .ic.del{color:var(--bad);background:var(--bad-soft)} .ic.flag{color:var(--warn);background:var(--warn-soft)} .ic.mute{color:var(--ink-3);background:var(--sunk)}
.pill{font:600 11px/1 var(--mono);padding:4px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.mute{background:var(--sunk);color:var(--ink-3)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.wrap{white-space:normal;line-height:1.35;overflow-wrap:anywhere}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.skipped{margin:10px 14px;font-size:13px;color:var(--ink-3)}
.skipped summary{cursor:pointer;font-weight:600}
.skipped div{padding:4px 0;overflow-wrap:anywhere}

/* diff, quotes, impact */
.diff{border:1px solid var(--line);border-radius:8px;overflow:hidden;font:13px/1.6 var(--mono)}
.diff div{padding:4px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.diff .ctx{color:var(--ink-3)} .diff .plus{background:var(--ok-soft);color:var(--ok)} .diff .minus{background:var(--bad-soft);color:var(--bad)}
.quote{border-left:2px solid var(--line-2);padding:4px 12px;color:var(--ink-2);font-size:14.5px;overflow-wrap:anywhere}
.quote small{display:block;font:11.5px var(--mono);color:var(--ink-3);margin-top:2px}
.quote .full{white-space:pre-wrap;font-size:13.5px;margin-top:6px;padding:8px 10px;background:var(--sunk);border-radius:6px;max-height:320px;overflow:auto}
.impact{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--info-soft);color:var(--info);font-size:14px;overflow-wrap:anywhere}
.impact.warn{background:var(--warn-soft);color:var(--warn)}
.descbox{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.descbox p{flex:1;min-width:0;overflow-wrap:anywhere}
.descbox.empty{border-style:dashed;color:var(--ink-3)}

/* decision dock */
.dock{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.dock.flat{border:0;padding:0}
.reason{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font:600 13px var(--sans);padding:6px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink-3)}
.chip.rej:hover{border-color:var(--bad);color:var(--bad)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.decided{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.decided.ok{background:var(--ok-soft);color:var(--ok)} .decided.bad{background:var(--bad-soft);color:var(--bad)} .decided.info{background:var(--info-soft);color:var(--info)} .decided.warn{background:var(--warn-soft);color:var(--warn)}
.decided span{flex:1;min-width:0}
.decided button{all:unset;cursor:pointer;font-weight:600;text-decoration:underline;white-space:nowrap}
.decided button:focus-visible{outline:2px solid currentColor;outline-offset:2px}

/* forms */
.opform{display:flex;flex-direction:column;gap:10px;background:var(--sunk);padding:14px;border-radius:8px}
.opform .ftitle{font-size:14px;overflow-wrap:anywhere}
.opform label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.opform label.inline{flex-direction:row;align-items:center;gap:8px;font-weight:400}
.opform .frow{display:flex;gap:8px;flex-wrap:wrap}
.req{color:var(--bad);font-weight:600}
select,input[type=text],input[type=search],textarea{font:14px var(--sans);padding:8px 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);max-width:100%;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.45}
input[type=checkbox]{accent-color:var(--accent)}

/* taxonomy tree */
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px}
.filters+.filters{padding-top:0}
.node{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;padding:7px 14px;font-size:14px;min-height:34px}
.node:hover{background:var(--sunk)} .node.sel{background:var(--accent-soft)}
.node:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.node.l1{font-weight:600}
.node.l2{padding-left:32px;color:var(--ink-2)}
.node.dead .lbl,.node.dead .n{color:var(--ink-3);opacity:.75}
.node.addrow{color:var(--accent);font-size:13px;font-weight:600}
.node.newrow .lbl{font-style:italic}
.node .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .n{font:12px var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.node .ic{font-size:12px;flex:none}
.flagc{color:var(--warn);flex:none;font-size:13px}
.sibs{display:flex;flex-direction:column}
.sibs .node{padding-left:0;padding-right:0;border-bottom:1px solid var(--line)}
.sibs .node:last-child{border-bottom:0}

/* changes, sheet */
.card{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card .head{display:flex;gap:10px;align-items:flex-start}
.card .head b{flex:1;min-width:0;overflow-wrap:anywhere}
.sheet{position:fixed;inset:0;background:rgba(10,14,12,.38);display:flex;justify-content:flex-end;z-index:5}
.sheet .panel{width:min(460px,100%);background:var(--paper);height:100%;padding:20px;display:flex;flex-direction:column;gap:14px;overflow:auto;border-left:1px solid var(--line)}
.sgroup{display:flex;flex-direction:column;gap:6px}
.sgroup h4{margin:0;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.srow{display:flex;gap:8px;font-size:14px;align-items:baseline;overflow-wrap:anywhere}
.srow>span:not(.ic){min-width:0}
.next{background:var(--sunk);border-radius:8px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.next ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.sfoot{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap;align-items:center;padding-top:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:6;max-width:calc(100vw - 32px)}
.toast span{overflow-wrap:anywhere}
.toast.bad{background:var(--bad);color:var(--paper)}
.toast button{all:unset;cursor:pointer;font-weight:600;color:var(--accent-soft);text-decoration:underline;white-space:nowrap}
.toast button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.done{padding:40px 22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty{padding:28px 22px;display:flex;flex-direction:column;gap:8px}

@media (max-width:860px){
  body{height:auto;min-height:100%;overflow:auto}
  .app{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav hr,.nav .hint{display:none}
  .view{grid-template-columns:1fr;display:flex;flex-direction:column}
  .list{border-right:0;border-bottom:1px solid var(--line);max-height:45vh}
  .detail{overflow:visible}
  .prog .track{width:80px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="ttl" id="ttl"><b id="ctxTitle">Taxonomy review</b><span id="ctxSub">Loading…</span></div>
  <div class="sp"></div>
  <div class="prog" id="prog" hidden><span id="progT"></span><span class="track"><i id="progB" style="width:0"></i></span></div>
  <button class="btn primary" id="openSubmit" type="button" data-act="open-sheet" hidden>Review &amp; submit <span class="count" id="subCount">0</span></button>
</header>
<div class="app" id="app">
  <nav class="nav" id="nav" aria-label="Views"></nav>
  <main class="viewhost" id="view"></main>
</div>
<div id="sheetHost"></div>
<div id="toastHost" aria-live="polite"></div>
<script>
"use strict";
const HEADER = "X-Review-Token";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
async function call(path, opts){
  const r = await fetch(path, opts);
  let j;
  try { j = await r.json(); } catch(e){ j = {errors:["the server sent an unreadable response (" + r.status + ")"]}; }
  if (!r.ok){ if (!j || typeof j !== "object") j = {errors:[String(j)]}; j.status = r.status; throw j; }
  return j;
}
const api = {
  get(p){ return call(p, {headers:{[HEADER]:TOKEN}}); },
  post(p, b){ return call(p, {method:"POST", headers:{[HEADER]:TOKEN, "Content-Type":"application/json"}, body:JSON.stringify(b || {})}); },
  state(){ return this.get("/api/state"); },
  node(label){ return this.get("/api/node/" + encodeURIComponent(label)); },
  chunk(id){ return this.get("/api/chunk/" + encodeURIComponent(id)); },
  impact(op){ return this.post("/api/impact", {op}); },
  decide(rec){ return this.post("/api/decision", rec); },
  submit(){ return this.post("/api/submit", {}); },
  cancel(){ return this.post("/api/cancel", {}); },
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
const num = x => { const n = Number(x); return Number.isFinite(n) ? n : 0; };
const plural = (n, one, many) => num(n) + " " + (num(n) === 1 ? one : (many || one + "s"));
const errText = e => (e && Array.isArray(e.errors)) ? e.errors.join("; ") : String(e && e.message || e);
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- state
let S = null;          // /api/state payload
let closed = null;     // {title, body} once the session is over
const U = {view:null, inboxSel:null, treeSel:null, filter:"all", sort:"tree", q:"", mtab:null, mSel:null, mq:"", sheet:false};
let nodeCache = {};
let P = {m:{}, adds:[]};   // pending ops, recomputed on each render

const latest = id => S.decisions[id];
const isActionable = it => it.status === "proposed" || it.status === "suppressed";
// A reopen puts a suppressed item back in the queue; it is not a decision of its own.
const isDecided = it => { const d = latest(it.id); return !!d && d.action !== "clear" && d.action !== "reopen"; };
const actionable = () => S.review.items.filter(isActionable);
const changeCount = () => actionable().filter(isDecided).length + S.proposals.length;
const itemOp = it => { const d = latest(it.id); return d && d.action === "amend" && isDecided(it) ? d.op : it.op; };
const itemTitle = it => it.op.name || it.op.node || it.op.metric || "";
const descOf = l => ((S.base.descriptions || {})[l] || "").trim();
const cnt = l => num(S.counts[slug(l)]);
const inductionItem = l => S.review.items.find(i => i.origin === "induction" && i.op.node === l);
const flagsOf = l => { const it = inductionItem(l); return (it && it.flags) || []; };
const aliasesOf = l => Object.keys(S.base.aliases || {}).filter(a => S.base.aliases[a] === l);
const tree = () => S.base.intent_taxonomy.tree;
const l1s = () => Object.keys(tree());
function parentOf(l){ for (const [p, kids] of Object.entries(tree())) if (kids.includes(l)) return p; return null; }
function allLabels(){
  const t = tree(), out = [];
  for (const [l1, kids] of Object.entries(t)){ out.push(l1); out.push(...kids); }
  out.push(...(S.base.intent_taxonomy.unassigned_l2 || []));
  return out;
}
function sameLevel(c){
  const t = tree();
  if (c.level === "L1") return l1s().filter(l => l !== c.label).sort((a, b) => a.localeCompare(b)).map(l => [l, l]);
  const out = [];
  for (const [p, kids] of Object.entries(t)) for (const k of kids) if (k !== c.label) out.push([k, k + " — " + p]);
  for (const k of S.base.intent_taxonomy.unassigned_l2 || []) if (k !== c.label) out.push([k, k]);
  return out.sort((a, b) => a[1].localeCompare(b[1]));
}

function pending(){
  const m = {}, adds = [];
  const put = (op, src) => {
    if (!op || op.type === "keep") return;
    if (op.type === "add" || op.type === "metric_add"){ adds.push({op, src}); m[op.name || op.metric] = {op, src}; return; }
    const s = op.node || op.from || op.metric;
    if (s) m[s] = {op, src};
  };
  for (const it of S.review.items){
    if (!isActionable(it) || !isDecided(it)) continue;
    const d = latest(it.id);
    if (d.action === "approve") put(it.op, {item:it.id});
    else if (d.action === "amend") put(d.op, {item:it.id});
  }
  for (const p of S.proposals) put(p.op, {proposal:p.item_id});
  return {m, adds};
}
const MARK = {add:["+","add"], describe:["✎","chg"], rename:["~","chg"], move:["~","chg"], split:["~","chg"],
  merge:["⊕","chg"], remove:["×","del"], metric_add:["+","add"], metric_edit:["~","chg"], metric_merge:["⊕","chg"], metric_remove:["×","del"]};
function mark(op){ const [c, k] = MARK[op.type] || ["?", "chg"]; return `<span class="ic ${esc(k)}" title="pending: ${esc(op.type.replace("_", " "))}">${esc(c)}</span>`; }

// ---------------------------------------------------------------- words
function opText(op){
  switch (op.type){
    case "add": return op.level === "L1" ? `Add “${op.name}” as a top-level category` : `Add “${op.name}” under ${op.parent}`;
    case "describe": return `Describe “${op.node}”`;
    case "rename": return `Rename “${op.node}” to “${op.new_name}”`;
    case "merge": return `Merge “${op.from}” into “${op.into}”`;
    case "move": return `Move “${op.node}” under ${op.new_parent}`;
    case "split": return `Split “${op.node}” into ${(op.into || []).map(x => "“" + x + "”").join(", ")}${op.retire ? " and retire it" : ""}`;
    case "remove": return `Remove “${op.node}”${String(op.disposition || "").startsWith("entity:") ? " (becomes a " + op.disposition.slice(7) + " entity)" : ""}`;
    case "keep": return `Keep “${op.node}”`;
    case "metric_add": return `Add metric “${op.metric}”`;
    case "metric_edit": return `Edit metric “${op.metric}” (${Object.keys(op.fields || {}).join(", ").replace("source_type", "type")})`;
    case "metric_merge": return `Merge metric “${op.from}” into “${op.into}”`;
    case "metric_remove": return `Remove metric “${op.metric}”`;
    default: return op.type;

}
function impactWords(i, op){
  if (!S.has_db) return "No store attached, so the tag impact can't be counted.";
  if (!i) return "";
  if (i.errors) return "Can't apply: " + i.errors.join("; ");
  const parts = [];
  if (num(i.tags_repointed)) parts.push(plural(i.tags_repointed, "tagged section") + (num(i.tags_repointed) === 1 ? " moves" : " move"));
  if (num(i.chunks_reclassified)) parts.push(num(i.chunks_reclassified) + " re-tagged");
  if (num(i.tags_deleted)) parts.push(num(i.tags_deleted) + " deleted");
  if (num(i.tags_deduplicated)) parts.push(plural(i.tags_deduplicated, "duplicate tag") + " merged");
  if (num(i.chunks_left_untagged_until_reclassify)) parts.push(num(i.chunks_left_untagged_until_reclassify) + " untagged until re-tagged");
  if (!parts.length) parts.push("No tagged sections change");
  if (op && (op.type === "rename" || op.type === "merge")) parts.push("alias kept");

}
function diffHTML(op){
  const L = [], ctx = t => L.push(["ctx", t]), plus = t => L.push(["plus", t]), minus = t => L.push(["minus", t]);
  const secs = l => plural(cnt(l), "section");
  switch (op.type){
    case "add": ctx(op.parent || "(top level)"); plus((op.parent ? "  " : "") + op.name); break;
    case "describe": { const cur = descOf(op.node); ctx(op.node); if (cur) minus(cur); else ctx("(no description)"); plus(op.description || ""); break; }
    case "rename": minus(`${op.node}   ${secs(op.node)}`); plus(`${op.new_name}   +${secs(op.node)} · “${op.node}” kept as alias`); break;
    case "merge": minus(`${op.from}   ${secs(op.from)}`); plus(`${op.into}   +${secs(op.from)} · “${op.from}” kept as alias`); break;
    case "move": minus(`${parentOf(op.node) || "(no parent)"} › ${op.node}`); plus(`${op.new_parent} › ${op.node}`); break;
    case "split": (op.retire ? minus : ctx)(`${op.node}   ${secs(op.node)}`);
      for (const n of op.into || []) plus(`  ${n}${(op.descriptions || {})[n] ? " — " + op.descriptions[n] : ""}`); break;
    case "remove": minus(`${op.node}   ${secs(op.node)}`);
      if (String(op.disposition).startsWith("entity:")) plus(`${op.disposition.slice(7)} entity: ${op.node}`);
      else ctx("label demoted; its sections are re-tagged");
      if (op.reason) ctx("reason: " + op.reason); break;
    case "keep": ctx(`${op.node}   ${secs(op.node)} · no change`); break;
    case "metric_add": plus(`${op.metric} · ${op.source_type} · grain ${op.grain || "—"}`); if (op.definition) plus("  " + op.definition); break;
    case "metric_edit": { const m = S.metrics.find(x => x.metric === op.metric) || {};
      ctx(op.metric); for (const [k, v] of Object.entries(op.fields || {})){ const lab = k === "source_type" ? "type" : k; minus(`${lab}: ${m[k] ?? "—"}`); plus(`${lab}: ${v ?? "—"}`); } break; }
    case "metric_merge": minus(op.from); plus(`${op.into} · “${op.from}” kept as a variant`); break;
    case "metric_remove": minus(op.metric); if (op.reason) ctx("reason: " + op.reason); break;
    default: ctx(JSON.stringify(op));
  }
  return `<div class="diff">${L.map(([c, t]) => `<div class="${esc(c)}">${c === "plus" ? "+ " : c === "minus" ? "− " : "  "}${esc(t)}</div>`).join("")}</div>`;
}

function treeFilter(l){

  const addsL2 = P.adds.filter(a => a.op.type === "add" && a.op.level === "L2"), addsL1 = P.adds.filter(a => a.op.type === "add" && a.op.level === "L1");

    case "m-remove": { const m = c.metric; return {title:`Remove “${m.metric}”`, fields:`<label>Reason <span class="req">required</span><input type="text" name="reason" autocomplete="off"></label>`,
      build: f => { const r = fval(f, "reason"); return r ? {type:"metric_remove", metric:m.metric, reason:r} : null; }}; }
    case "m-add": return {title:"Add metric", ok:"Add to changes", fields:`<label>Name <span class="req">required</span><input type="text" name="metric" autocomplete="off"></label><label>Type <select name="source_type">${TYPES.map(t => opt(t, t)).join("")}</select></label><label>Grain <input type="text" name="grain" placeholder="e.g. branch, month"></label><label>Definition <textarea name="definition" rows="3"></textarea></label>`,
      build: f => { const n = fval(f, "metric"); return n ? {type:"metric_add", metric:n, source_type:fval(f, "source_type"), grain:fval(f, "grain") || null, definition:fval(f, "definition") || null} : null; }};
  }
  return null;
}
let formSeq = 0, formTimer = null;
function openForm(kind, c){
  const slot = $("formslot"); if (!slot || !c) return;
  const spec = formSpec(kind, c); if (!spec) return;
  const amend = !!c.itemId && kind !== "add" && !kind.startsWith("m-");
  const ok = spec.ok || (amend ? "Save decision" : "Add to changes");
  slot.innerHTML = `<form class="opform" id="opform" novalidate><b class="ftitle">${esc(spec.title)}</b>${spec.fields}
    <div id="fdiff"></div><div class="impact" id="fimp" hidden></div><div class="err" id="ferr" role="alert"></div>
    <div class="frow"><button class="btn primary" type="submit" id="fok" disabled>${esc(ok)}</button><button class="btn" type="button" data-act="form-cancel">Cancel</button></div></form>`;
  const form = $("opform");
  let splitNames = "";
  const refresh = () => {
    if (kind === "split"){
      const names = fval(form, "into").split("\n").map(s => s.trim()).filter(Boolean), key = names.join("\n");
      if (key !== splitNames){
        splitNames = key; const box = $("splitDescs"), old = {};
        box.querySelectorAll("[data-split]").forEach(i => { old[i.dataset.split] = i.value; });
        box.innerHTML = names.length ? `<span class="note">Optional description for each new name</span>` + names.map(n => `<label>${esc(n)}<input type="text" data-split="${esc(n)}" value="${esc(old[n] || "")}"></label>`).join("") : "";
      }
    }
    const op = spec.build(form);
    $("fok").disabled = !op; $("ferr").textContent = "";
    if (spec.noPreview) return;
    const imp = $("fimp");
    if (!op){ clearTimeout(formTimer); formSeq++; $("fdiff").innerHTML = ""; imp.hidden = true; return; }
    $("fdiff").innerHTML = diffHTML(op);
    clearTimeout(formTimer);
    formTimer = setTimeout(async () => {
      const mine = ++formSeq;
      try { const r = await api.impact(op); if (mine !== formSeq || !$("fimp")) return; imp.hidden = false; imp.textContent = impactWords(r.impact, op); }
      catch(e){ if (mine !== formSeq || !$("fimp")) return; imp.hidden = true; if (e.status === 409) return onClosed(); $("ferr").textContent = errText(e); }
    }, 250);
  };
  form.addEventListener("input", refresh);
  form.addEventListener("change", refresh);
  form.onsubmit = async ev => {
    ev.preventDefault();
    const op = spec.build(form); if (!op) return;
    $("fok").disabled = true;
    let rec, msg;
    if (kind === "reject-other"){ rec = {action:"reject", item_id:c.itemId, reason:op.reason}; msg = `Rejected “${c.label}”: ${op.reason}`; }
    else if (amend){ rec = {action:"amend", item_id:c.itemId, op}; msg = opText(op); }
    else { rec = {action:"propose", op}; msg = "Added to your changes: " + opText(op); }
    const after = kind === "add" ? out => { U.treeSel = {kind:"pending", key:"p:" + out.record.item_id}; }
      : kind === "m-add" ? out => { U.mtab = op.source_type === "stated" ? "stated" : computableBucket(); U.mSel = "pending:" + out.record.item_id; } : null;
    const ok = await send(rec, msg, null, after);
    if (!ok && $("fok")) $("fok").disabled = false;
  };
  refresh();
  const first = form.querySelector("input,textarea,select"); if (first) first.focus();
}

// ---------------------------------------------------------------- decisions, undo, toast
// The record each item had before its latest decision in this tab, so an Undo restores the
// full previous state (e.g. a reopen), not just "undecided".
const hist = {};
function undoRecFor(it){
  if (Object.prototype.hasOwnProperty.call(hist, it.id)) return restoreRec(it.id, hist[it.id]);
  const d = latest(it.id);
  // A suppressed item can only have been approved or amended after a reopen.
  if (it.status === "suppressed" && d && (d.action === "approve" || d.action === "amend")) return {action:"reopen", item_id:it.id};
  return {action:"clear", item_id:it.id};
}
function restoreRec(itemId, prev){
  if (prev && prev.action !== "clear"){
    const r = {action:prev.action, item_id:itemId};
    if (prev.op) r.op = prev.op; if (prev.reason) r.reason = prev.reason;
    return r;
  }
  return {action:"clear", item_id:itemId};
}
let busy = false;
async function send(rec, msg, undoOverride, beforeRender){
  if (busy) return false;   // a double click or key repeat must not append a second record
  busy = true;
  try { return await sendNow(rec, msg, undoOverride, beforeRender); } finally { busy = false; }
}
async function sendNow(rec, msg, undoOverride, beforeRender){
  const prev = rec.item_id ? (S.decisions[rec.item_id] || null) : null;
  const before = U.view === "inbox" ? inboxOrder().todo.map(i => i.id) : [];
  let out;
  try { out = await api.decide(rec); }
  catch(e){
    if (e.status === 409){ onClosed(); return false; }
    const el = $("ferr"); if (el) el.textContent = errText(e); else toast(errText(e), null, true);
    return false;
  }
  if (rec.item_id && rec.action !== "propose" && rec.action !== "withdraw") hist[rec.item_id] = prev;
  let undo = undoOverride || null;
  if (!undo){
    if (rec.action === "propose") undo = {action:"withdraw", item_id:out.record.item_id};
    else if (rec.action !== "withdraw" && rec.action !== "clear") undo = restoreRec(rec.item_id, prev);
  }
  try { S = await api.state(); nodeCache = {}; } catch(e){ toast(errText(e), null, true); return true; }
  if (U.view === "inbox" && rec.item_id === U.inboxSel && ["approve", "reject", "amend"].includes(rec.action)){
    const todo = inboxOrder().todo.map(i => i.id), i = before.indexOf(rec.item_id);
    U.inboxSel = before.slice(i + 1).find(id => todo.includes(id)) || todo[0] || rec.item_id;
  }
  if (beforeRender) beforeRender(out);
  render();
  toast(msg, undo);
  return true;
}
let toastTimer = null, undoRec = null;
function toast(msg, undo, bad){
  undoRec = undo || null;
  $("toastHost").innerHTML = `<div class="toast ${bad ? "bad" : ""}" role="status"><span>${esc(msg)}</span>${undo ? `<button type="button" data-act="toast-undo">Undo</button>` : ""}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toastHost").innerHTML = ""; undoRec = null; }, bad ? 8000 : 5000);
}
async function doUndo(){
  if (!undoRec || busy) return;   // keep the Undo offer if a decision is still in flight
  const r = undoRec; undoRec = null; $("toastHost").innerHTML = "";
  // send() offers a redo in its own toast; after undoing a decision, keep that item selected.
  await send(r, "Undone", null, () => { if (r.item_id && r.action !== "withdraw" && U.view === "inbox") U.inboxSel = r.item_id; });
}
function onClosed(){
  closed = {title:"This review session is closed.", body:"It was submitted, cancelled or timed out, so nothing more is recorded. Ask Claude to reopen the review to continue."};
  render();
}

// ---------------------------------------------------------------- submit sheet
const GROUPS = ["Add", "Describe", "Rename", "Merge", "Move", "Split", "Remove", "Metrics", "Rejected"];
const GROUP_OF = {add:"Add", describe:"Describe", rename:"Rename", merge:"Merge", move:"Move", split:"Split", remove:"Remove"};
function renderSheet(){
  const host = $("sheetHost");
  if (!U.sheet){ host.innerHTML = ""; return; }
  const g = {}; GROUPS.forEach(k => g[k] = []);
  let kept = 0;
  for (const it of actionable()){
    if (!isDecided(it)) continue;
    const d = latest(it.id);
    if (d.action === "reject"){ g.Rejected.push(`<div class="srow"><span class="ic del">×</span><span>${esc(itemTitle(it))} <span class="note">${esc(d.reason)}</span></span></div>`); continue; }
    const op = d.action === "amend" ? d.op : it.op;
    if (op.type === "keep"){ kept++; continue; }
    g[GROUP_OF[op.type] || "Metrics"].push(`<div class="srow">${mark(op)}<span>${esc(opText(op))}</span></div>`);
  }
  for (const p of S.proposals){
    const note = p.op.type.startsWith("metric_") ? "" : impactWords(p.impact, p.op);
    g[GROUP_OF[p.op.type] || "Metrics"].push(`<div class="srow">${mark(p.op)}<span>${esc(opText(p.op))}${note ? ` <span class="note">${esc(note)}</span>` : ""}</span></div>`);
  }
  const und = actionable().filter(i => !isDecided(i)).length, mode = S.review.mode;
  const warn = !und ? "" : mode === "drift" ? `${plural(und, "proposal")} not reviewed. They aren't added or rejected, and come back next refresh.`
    : mode === "draft" ? `${plural(und, "category", "categories")} not reviewed. They're kept as they are.`
    : mode === "describe" ? `${plural(und, "description")} not reviewed. They aren't applied; Claude can draft them again later.`
    : `${plural(und, "item")} not reviewed.`;
  const imp = S.impact || {}, re = num(imp.chunks_reclassified), n = changeCount(), next = num(S.base.version) + 1;
  const steps = [`Claude applies your decisions as taxonomy v${next} and points current.json at it.`,
    mode === "draft" ? "Claude builds the graph and tags every section with the categories you kept." : "Tags move with renames and merges; nothing tagged is lost.",
    re ? `About ${plural(re, "section")} are re-tagged by agents (a few minutes).` : "Only sections your changes touch are re-tagged.",
    "Claude reports the result, including coverage, in the chat."];
  const body = GROUPS.filter(k => g[k].length).map(k => `<div class="sgroup"><h4>${esc(k === "Rejected" ? "Rejected (won't be proposed again)" : k)} · ${num(g[k].length)}</h4>${g[k].join("")}</div>`).join("");
  host.innerHTML = `<div class="sheet" data-act="sheet-bg"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" id="sheetPanel">
    <h3 id="sheetTitle">Submit this review</h3>
    ${body || `<p class="note">No changes. Submitting records that you reviewed the taxonomy and changed nothing.</p>`}
    ${kept ? `<p class="note">${plural(kept, "category", "categories")} kept as they are.</p>` : ""}
    ${imp.errors ? `<div class="impact warn">${esc(impactWords(imp))}</div>` : S.has_db && (S.proposals.length || n) ? `<div class="impact">Altogether: ${esc(impactWords(imp))}</div>` : ""}
    ${warn ? `<div class="impact warn">${esc(warn)}</div>` : ""}
    <div class="next"><b>What happens next, in Claude Code</b><ol>${steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>
    <div class="err" id="suberr" role="alert"></div>
    <div class="sfoot"><button type="button" class="btn" data-act="sheet-close">Keep reviewing</button><button type="button" class="btn primary" data-act="sheet-submit">${n ? `Submit ${plural(n, "decision")}` : "Submit with no changes"}</button></div>
    <div id="cancelBox"><button type="button" class="linkbtn" data-act="cancel-ask">Close the review without submitting</button></div>
  </div></div>`;
  $("sheetPanel").focus();
}

// ---------------------------------------------------------------- events
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]"); if (!el || !S) return;
  const a = el.dataset.act, id = el.dataset.id;
  const item = id ? S.review.items.find(i => i.id === id) : null;
  switch (a){
    case "view": U.view = el.dataset.v; render(); break;
    case "pick-item": U.inboxSel = id; renderView(); break;
    case "pick-node": U.treeSel = {kind:"node", label:el.dataset.label}; if (U.view !== "taxonomy"){ U.view = "taxonomy"; render(); } else renderView(); break;
    case "pick-pending": U.treeSel = {kind:"pending", key:el.dataset.key}; renderView(); break;
    case "new-cat": U.treeSel = {kind:"new", parent: el.dataset.parent || ""}; renderView(); break;
    case "filter": U.filter = el.dataset.f; renderView(); break;
    case "sort": U.sort = el.dataset.s; renderView(); break;
    case "mtab": U.mtab = el.dataset.t; U.mSel = null; renderView(); break;
    case "pick-metric": U.mSel = el.dataset.name; renderView(); break;
    case "new-metric": U.mSel = "__new"; renderView(); openForm("m-add", {}); break;
    case "approve": if (item) await send({action:"approve", item_id:item.id},
      el.dataset.revert ? `Reverted “${itemTitle(item)}” to keep` : item.origin === "induction" ? `Kept “${itemTitle(item)}”` : `Approved “${itemTitle(item)}”`); break;
    case "reject": if (item) await send({action:"reject", item_id:item.id, reason:el.dataset.reason}, `Rejected “${itemTitle(item)}”: ${el.dataset.reason}`); break;
    case "reopen": if (item) await send({action:"reopen", item_id:item.id}, `Reopened “${itemTitle(item)}”`); break;
    case "undo-item": if (item && isDecided(item)) await send(undoRecFor(item), `Undid the decision on “${itemTitle(item)}”`, restoreRec(item.id, latest(item.id))); break;
    case "withdraw": { const p = !busy && S.proposals.find(x => x.item_id === id);   // a repeat click is ignored
      if (p) await send({action:"withdraw", item_id:p.item_id}, "Withdrawn: " + opText(p.op), {action:"propose", op:p.op}); break; }
    case "form": openForm(el.dataset.form, ctxFor(el.dataset.form)); break;
    case "form-cancel": { const s = $("formslot"); if (s) s.innerHTML = "";
      if (U.view === "taxonomy" && U.treeSel && U.treeSel.kind === "new"){ U.treeSel = null; renderView(); }
      if (U.view === "metrics" && U.mSel === "__new"){ U.mSel = null; renderView(); } break; }
    case "chunk": {
      const q = el.closest(".quote"); if (!q) break;
      const box = q.querySelector(`.full[data-for="${CSS.escape(id)}"]`);
      if (box){ box.remove(); break; }
      try { const c = await api.chunk(id); q.insertAdjacentHTML("beforeend", `<div class="full" data-for="${esc(id)}"><small>#${esc(c.chunk_id)} · ${esc(c.source || "")}${c.title ? " · " + esc(c.title) : ""}</small>${esc(c.text)}</div>`); }
      catch(e){ toast(errText(e), null, true); }
      break; }
    case "toast-undo": await doUndo(); break;
    case "open-sheet": U.sheet = true; renderSheet(); break;
    case "sheet-bg": if (ev.target === el){ U.sheet = false; renderSheet(); } break;
    case "sheet-close": U.sheet = false; renderSheet(); break;
    case "sheet-submit": {
      el.disabled = true;
      try { await api.submit(); U.sheet = false; S.submitted = true; render(); }
      catch(e){ if (e.status === 409){ U.sheet = false; onClosed(); } else { $("suberr").textContent = errText(e); el.disabled = false; } }
      break; }
    case "cancel-ask": $("cancelBox").innerHTML = `<div class="decided warn"><span>Close without submitting? Your decisions so far are saved, and Claude applies nothing.</span><button type="button" data-act="cancel-yes">Close the review</button></div>`; break;
    case "cancel-yes":
      try { await api.cancel(); U.sheet = false; closed = {title:"Closed without submitting.", body:"Your decisions so far are saved. Ask Claude to reopen the review to continue."}; render(); }
      catch(e){ if (e.status === 409){ U.sheet = false; onClosed(); } else toast(errText(e), null, true); }
      break;
  }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "mq"){ U.mq = ev.target.value; const pos = ev.target.selectionStart; renderView(); const m = $("mq"); m.focus(); m.setSelectionRange(pos, pos); }
});
document.addEventListener("keydown", ev => {
  if (!S || closed || S.submitted) return;
  if (ev.key === "Escape" && U.sheet){ U.sheet = false; renderSheet(); $("openSubmit").focus(); return; }
  if (U.view !== "inbox" || U.sheet || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const t = ev.target;
  if (t && (t.isContentEditable || /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))) return;
  const {todo, done} = inboxOrder(), order = todo.concat(done), i = order.findIndex(x => x.id === U.inboxSel), it = order[i];
  const k = ev.key.toLowerCase();
  if (k === "j" && i < order.length - 1){ U.inboxSel = order[i + 1].id; renderView(); }
  else if (k === "k" && i > 0){ U.inboxSel = order[i - 1].id; renderView(); }
  else if (k === "a" && it && !isDecided(it) && !(it.status === "suppressed" && !((latest(it.id) || {}).action === "reopen")))
    send({action:"approve", item_id:it.id}, it.origin === "induction" ? `Kept “${itemTitle(it)}”` : `Approved “${itemTitle(it)}”`);
  else if (k === "r" && it && !isDecided(it) && REJECT_REASONS[it.origin]){
    const r = it.status === "suppressed" && !((latest(it.id) || {}).action === "reopen") ? ((it.prior || {}).reason || "Rejected before") : REJECT_REASONS[it.origin][0];
    send({action:"reject", item_id:it.id, reason:r}, `Rejected “${itemTitle(it)}”: ${r}`);
  }
  else if (k === "u" && undoRec) doUndo();
  else return;
  ev.preventDefault();
});

api.state().then(st => {
  S = st;
  U.view = actionable().length ? "inbox" : "taxonomy";
  render();
}).catch(e => {
  $("ctxSub").textContent = "";
  $("nav").hidden = true; $("app").classList.add("solo");
  $("view").innerHTML = `<div class="done"><h3>Couldn't load the review.</h3><p class="err">${esc(errText(e))}</p><p class="note">Open the exact link Claude printed; it carries the access token.</p></div>`;
});
</script>
</body>
