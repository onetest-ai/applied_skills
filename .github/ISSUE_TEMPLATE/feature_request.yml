name: Feature request
description: Suggest a new capability or an improvement to an existing skill.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the **problem** first, not just a proposed solution — it helps us find
        the best fit. Remember this toolkit stays generic and corpus-agnostic.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and where does the toolkit fall short today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Which skill would it live in (or is it new)?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: generic
    attributes:
      label: Confirmation
      options:
        - label: This is a generic capability, not something specific to one corpus/client.
          required: true
